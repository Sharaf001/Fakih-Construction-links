<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fakih Construction</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--paper:#F6F6F4;--line:#DEDED9;--ink:#141414;--gold:#B08224;--goldd:#8f6a1c;--mute:#6b6b66;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background-color:var(--paper);
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
background-size:40px 40px;background-position:center top;
color:var(--ink);font-family:"Montserrat","Segoe UI",Helvetica,Arial,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:34px 20px 36px;display:flex;flex-direction:column;align-items:center}
.logo{width:min(330px,82%);height:auto;display:block;margin-bottom:30px}
.btn{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:0 18px;min-height:64px;border-radius:2px;text-decoration:none;font-weight:700;font-size:16px;letter-spacing:.01em;transition:background-color .15s,color .15s,border-color .15s}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ico{flex:none;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico .f{fill:currentColor;stroke:none}
.small{display:block;font-weight:500;font-size:12.5px;opacity:.78;margin-top:2px;overflow-wrap:anywhere}
.lbl{display:flex;flex-direction:column;min-width:0}
.primary{background:var(--gold);color:#111;min-height:76px;font-size:18px}
.primary:hover{background:var(--goldd);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin:12px 0}
.tile{flex-direction:column;justify-content:center;gap:10px;min-height:112px;background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.tile .ico{width:32px;height:32px;color:var(--gold)}
.tile:hover{background:var(--ink);color:#fff}
.wide{background:#fff;color:var(--ink);border:1.5px solid var(--ink);margin-bottom:12px}
.wide .ico{color:var(--gold)}
.wide:hover{background:var(--ink);color:#fff}
.dark{background:var(--ink);color:#fff}
.dark .ico{color:var(--gold)}
.dark:hover{background:#333}
footer{margin-top:22px;font-size:12px;font-weight:500;color:var(--mute);letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
@media (min-width:600px){main{padding-top:56px}}
</style>
</head>
